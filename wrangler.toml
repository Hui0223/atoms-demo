name = "atoms-demo-writing-test"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "STORE"
class_name = "AppStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppStore"]

[vars]
PRIMARY_MODEL = "@cf/openai/gpt-oss-120b"
BACKUP_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
PLANNER_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
EDIT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# 设为 "1" 可强制全站进入演示模式（不调用任何模型）
AI_DISABLED = "0"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = true
