name = "atoms-demo-writing-test"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "AppStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppStore"]

[vars]
# 模型白名单（Anthropic Messages 兼容接口上的确切模型名）
MODEL_DEEPSEEK = "deepseek-v4-flash"
MODEL_GLM = "glm-5.3-flash"
# 设为 "1" 可强制全站进入演示模式（不调用任何模型）
AI_DISABLED = "0"
# 接口地址与密钥只通过 Secret 注入（不写在这里）：
#   npx wrangler secret put ANTHROPIC_BASE_URL
#   npx wrangler secret put ANTHROPIC_AUTH_TOKEN

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = true
